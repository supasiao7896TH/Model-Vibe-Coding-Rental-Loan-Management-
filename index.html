<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://cdn.tailwindcss.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self';
      frame-ancestors 'none';
    ">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>คอนโด 4 ห้อง | by Supasit.A</title>

    <!-- Tailwind CDN: เร็ว ไม่ต้อง build แยก แลกกับ style-src ต้องเปิด 'unsafe-inline' (ดู comment ใน CSP ด้านบน) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen font-['Noto_Sans_Thai'] bg-[var(--bg-page)] text-[var(--text-primary)]">
    <div class="flex min-h-screen md:flex-row flex-col">

      <!-- Sidebar: เห็นเฉพาะจอ >= md (PC/Desktop) -->
      <aside class="hidden md:flex md:flex-col md:w-20 md:items-center md:py-6 md:gap-6 glass md:!rounded-none border-r border-[var(--border)]">
        <span class="text-2xl">🏠</span>
        <nav class="flex flex-col gap-4" id="sidebarNav">
          <button type="button" data-action="switch-view" data-view="dashboard" class="text-xl p-2 rounded-[10px] hover:bg-[var(--bg-raised)] hover:text-[var(--brand)] transition-colors" aria-label="Dashboard">📊</button>
          <button type="button" data-action="switch-view" data-view="rooms" class="text-xl p-2 rounded-[10px] hover:bg-[var(--bg-raised)] hover:text-[var(--brand)] transition-colors" aria-label="ห้องพัก">🏘️</button>
          <button type="button" data-action="switch-view" data-view="transactions" class="text-xl p-2 rounded-[10px] hover:bg-[var(--bg-raised)] hover:text-[var(--brand)] transition-colors" aria-label="ธุรกรรม">📋</button>
          <button type="button" data-action="switch-view" data-view="reminders" class="text-xl p-2 rounded-[10px] hover:bg-[var(--bg-raised)] hover:text-[var(--brand)] transition-colors" aria-label="แจ้งเตือน">🔔</button>
        </nav>
      </aside>

      <div class="flex-1 flex flex-col">
        <!-- Header: Glass sticky + Fraunces (hero) + Status Indicator -->
        <header class="sticky top-0 z-20 flex items-center justify-between px-4 py-3 glass md:!rounded-none border-b border-[var(--border)]">
          <h1 class="font-['Fraunces'] font-semibold text-lg">🏠 คอนโด 4 ห้อง</h1>
          <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-[var(--success)] glow-online" title="พร้อมใช้งาน (ข้อมูลอยู่ในเครื่อง)" aria-label="สถานะ: พร้อมใช้งาน"></span>
            <button type="button" data-action="toggle-theme" id="themeToggleBtn" aria-label="สลับโหมดมืด/สว่าง" class="text-xl btn-press">🌙</button>
          </div>
        </header>

        <!-- View container: JS จะ render เนื้อหาของแต่ละหน้าลงตรงนี้ -->
        <main id="viewContainer" class="flex-1 p-4 pb-24 md:pb-6 max-w-3xl w-full mx-auto"></main>
      </div>

      <!-- Bottom nav: เห็นเฉพาะจอ < md (Mobile) -->
      <nav class="md:hidden fixed bottom-0 inset-x-0 z-20 flex justify-around items-center py-2 glass !rounded-none border-t border-[var(--border)]">
        <button type="button" data-action="switch-view" data-view="dashboard" class="text-xl p-2 rounded-[10px] btn-press active:text-[var(--brand)]" aria-label="Dashboard">📊</button>
        <button type="button" data-action="switch-view" data-view="rooms" class="text-xl p-2 rounded-[10px] btn-press active:text-[var(--brand)]" aria-label="ห้องพัก">🏘️</button>
        <button type="button" data-action="open-add-transaction" class="text-2xl p-2 rounded-[10px] btn-press active:text-[var(--brand)]" aria-label="เพิ่มธุรกรรม">➕</button>
        <button type="button" data-action="switch-view" data-view="reminders" class="text-xl p-2 rounded-[10px] btn-press active:text-[var(--brand)]" aria-label="แจ้งเตือน">🔔</button>
      </nav>

      <!-- Glass Badge: บังคับทุกแอปตาม layout-and-brand.md -->
      <div class="glass badge-glow fixed bottom-20 md:bottom-5 right-4 z-30 px-3 py-1.5 text-xs select-none">
        by Supasit.A
      </div>
    </div>

    <!-- Modal และ Toast จะถูก inject เข้ามาตรงนี้โดย UI_RENDERER -->
    <div id="modalRoot"></div>
    <div id="toastRoot" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
