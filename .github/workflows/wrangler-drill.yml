name: Wrangler Drill Helper

# ไฟล์ชั่วคราวสำหรับซ้อม rollback (2026-09-02) — ลบทิ้งได้หลังซ้อมเสร็จ
# รันคำสั่ง wrangler ตามที่สั่งผ่าน input โดยใช้ secret ที่มีอยู่แล้วของ repo นี้
on:
  workflow_dispatch:
    inputs:
      command:
        description: "wrangler subcommand + args เช่น 'deployments list'"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: รันคำสั่ง wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler ${{ github.event.inputs.command }}
