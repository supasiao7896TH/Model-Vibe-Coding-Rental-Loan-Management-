name: Wrangler Drill Helper

# ไฟล์ชั่วคราวสำหรับซ้อม rollback (2026-09-02) — ลบทิ้งได้หลังซ้อมเสร็จ
on:
  push:
    branches: [claude/rollback-drill]

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: wrangler rollback ไปเวอร์ชันดีล่าสุดก่อนซ้อม
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          echo "::group::wrangler rollback"
          npx wrangler rollback 1a50d5ff-cf55-4d3c-b16f-4d137b1aed3b -y -m "rollback drill 2026-09-02"
          echo "::endgroup::"
      - name: ยืนยันสถานะหลัง rollback
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          echo "::group::wrangler deployments list (หลัง rollback)"
          npx wrangler deployments list
          echo "::endgroup::"
